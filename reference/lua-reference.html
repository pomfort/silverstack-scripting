<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Silverstack Lua API Reference</title>
<style>
:root {
    --sidebar-width: 260px;
    --bg: #fff;
    --bg-secondary: #f5f6f8;
    --bg-hover: #e8eaed;
    --border: #d1d5db;
    --text: #1a1a1a;
    --text-secondary: #555;
    --accent: #2563eb;
    --accent-light: #eff6ff;
    --code-bg: #f0f2f5;
    --badge-debug: #f59e0b;
    --badge-deprecated: #ef4444;
    --font-mono: "SF Mono", "Menlo", "Monaco", "Consolas", monospace;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: var(--font-sans);
    color: var(--text);
    background: var(--bg);
    display: flex;
    height: 100vh;
    overflow: hidden;
}

nav {
    width: var(--sidebar-width);
    min-width: var(--sidebar-width);
    height: 100vh;
    overflow-y: auto;
    background: var(--bg-secondary);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
}
nav .search-box {
    padding: 12px;
    position: sticky;
    top: 0;
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    z-index: 1;
}
nav input {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    outline: none;
    background: var(--bg);
}
nav input:focus { border-color: var(--accent); }
nav .nav-section { padding: 6px 0; }
nav .nav-section-title {
    padding: 4px 14px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-secondary);
}
nav a.nav-item {
    display: block;
    padding: 3px 14px 3px 20px;
    font-size: 13px;
    color: var(--text);
    text-decoration: none;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
nav a.nav-item:hover { background: var(--bg-hover); }
nav a.nav-item.nav-sub {
    padding-left: 38px;
    font-size: 12px;
    color: var(--text-secondary);
}
nav .nav-namespace {
    padding: 10px 14px 2px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
    letter-spacing: 0.03em;
}

main {
    flex: 1;
    overflow-y: auto;
    padding: 32px 40px 64px;
}
main h1 { font-size: 26px; font-weight: 700; margin-bottom: 4px; }
main .subtitle { color: var(--text-secondary); font-size: 14px; margin-bottom: 28px; }

h2.section-header {
    font-size: 19px;
    font-weight: 600;
    padding-bottom: 6px;
    border-bottom: 2px solid var(--border);
    margin: 32px 0 14px;
}
h3.namespace-header {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-secondary);
    margin: 20px 0 8px;
}

.badge {
    font-size: 10px;
    font-weight: 600;
    padding: 1px 5px;
    border-radius: 3px;
    vertical-align: middle;
    margin-left: 4px;
}
.badge-debug { background: #fef3c7; color: var(--badge-debug); }
.badge-deprecated { background: #fee2e2; color: var(--badge-deprecated); }

.type-entry { margin-bottom: 16px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.type-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: var(--bg-secondary);
    cursor: pointer;
    user-select: none;
}
.type-header:hover { background: var(--bg-hover); }
.type-header .chevron {
    font-size: 11px;
    color: var(--text-secondary);
    transition: transform 0.15s;
    flex-shrink: 0;
}
.type-entry.open .chevron { transform: rotate(90deg); }
.type-header .type-name {
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 600;
    color: var(--accent);
}
.type-header .type-desc {
    font-size: 13px;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.type-body { display: none; border-top: 1px solid var(--border); padding: 12px 16px; }
.type-entry.open .type-body { display: block; }
.type-body > .description { font-size: 14px; margin-bottom: 10px; }

.method-block {
    padding: 6px 0 6px 12px;
    margin: 8px 0;
}
.method-block h4 {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    margin: 0 0 2px;
}

.fn-entry { margin-bottom: 14px; }
.fn-entry h3 {
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 600;
    color: var(--accent);
    margin: 0 0 2px;
}

.enum-entry { margin-bottom: 14px; }
.enum-entry h3 {
    font-size: 15px;
    font-weight: 600;
    margin: 0 0 6px;
}

code.sig {
    font-family: var(--font-mono);
    font-size: 13px;
    background: var(--code-bg);
    padding: 4px 8px;
    border-radius: 5px;
    display: block;
    margin: 2px 0 4px;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-all;
}
.description code, .type-desc code, .args-table code {
    font-family: var(--font-mono);
    font-size: 0.92em;
    background: var(--code-bg);
    padding: 1px 4px;
    border-radius: 3px;
}
.description { font-size: 14px; color: var(--text); margin: 3px 0; }
.deprecated-note { font-size: 13px; color: var(--badge-deprecated); margin: 3px 0; }

.args-table { font-size: 13px; border-collapse: collapse; margin: 4px 0; }
.args-table th {
    text-align: left;
    font-weight: 600;
    padding: 2px 10px 2px 0;
    color: var(--text-secondary);
    font-size: 12px;
}
.args-table td { padding: 2px 10px 2px 0; }
.args-table td:first-child { font-family: var(--font-mono); white-space: nowrap; }

.enum-cases { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.enum-case {
    font-family: var(--font-mono);
    font-size: 12px;
    background: var(--code-bg);
    padding: 3px 8px;
    border-radius: 4px;
}

code.sig a.sig-link {
    color: var(--accent);
    text-decoration: none;
    cursor: pointer;
}
code.sig a.sig-link:hover { text-decoration: underline; }
.description.namespace {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: 4px;
}

.no-results {
    text-align: center;
    padding: 40px;
    color: var(--text-secondary);
    font-size: 14px;
}
.hidden { display: none !important; }
</style>
</head>

<nav>

function esc(s) {
    if (!s) return "";
    const el = document.createElement("span");
    el.textContent = s;
    return el.innerHTML;
}

function badgeHtml(item) {
    let h = "";
    if (item.deprecation) h += '<span class="badge badge-deprecated">DEPRECATED</span>';
    return h;
}

const typeIndex = {};
function buildTypeIndex() {
    if (!D) return;
    D.types.forEach(t => {
        typeIndex[t.typename] = slug("type", t.typename);
    });
    D.enums.forEach(e => {
        typeIndex[e.name] = slug("enum", e.name);
    });
}

function linkifySignature(sig) {
    const escaped = esc(sig);
    const sortedNames = Object.keys(typeIndex).sort((a, b) => b.length - a.length);
    if (!sortedNames.length) return escaped;
    const pattern = new RegExp("\\b(" + sortedNames.map(n => n.replace(/\./g, "\\.")).join("|") + ")\\b", "g");
    return escaped.replace(pattern, (match) => {
        const target = typeIndex[match];
        return target ? '<a href="#' + target + '" class="sig-link">' + match + '</a>' : match;
    });
}

function linkifyType(typeStr) {
    const escaped = esc(typeStr);
    const sortedNames = Object.keys(typeIndex).sort((a, b) => b.length - a.length);
    if (!sortedNames.length) return escaped;
    const pattern = new RegExp("\\b(" + sortedNames.map(n => n.replace(/\./g, "\\.")).join("|") + ")\\b", "g");
    return escaped.replace(pattern, (match) => {
        const target = typeIndex[match];
        return target ? '<a href="#' + target + '" class="sig-link">' + match + '</a>' : match;
    });
}

function extractReturnType(sig) {
    const m = sig.match(/->\s*(.+)$/);
    return m ? m[1].trim() : null;
}

function renderDescription(text) {
    if (!text) return '';
    const parts = text.split('`');
    let out = '';
    for (let i = 0; i < parts.length; i++) {
        if (i % 2 === 0) {
            out += esc(parts[i]);
        } else {
            out += '<code>' + linkifyType(parts[i]) + '</code>';
        }
    }
    return out;
}

function fnDetailHtml(f) {
    let h = '<code class="sig">' + linkifySignature(f.signature) + '</code>';
    if (f.deprecation) h += '<div class="deprecated-note">Deprecated: ' + esc(f.deprecation) + '</div>';
    if (f.description) h += '<div class="description">' + renderDescription(f.description) + '</div>';
    if (f.args.length) {
        h += '<table class="args-table"><thead><tr><th>Parameter</th><th>Description</th></tr></thead><tbody>';
        f.args.forEach(a => { h += '<tr><td>' + linkifyType(a.type) + '</td><td>' + renderDescription(a.description) + '</td></tr>'; });
        h += '</tbody></table>';
    }
    return h;
}

function slug(prefix, name) {
    return prefix + "-" + name.replace(/[^a-zA-Z0-9]+/g, "-").toLowerCase();
}

function expandTypeFor(targetId) {
    const el = document.getElementById(targetId);
    if (!el) return;
    const typeEntry = el.closest(".type-entry") || el;
    if (typeEntry.classList.contains("type-entry")) {
        typeEntry.classList.add("open");
    }
}

function build() {
    if (!D) return;
    buildTypeIndex();
    const navEl = document.getElementById("nav-list");
    const contentEl = document.getElementById("content");
    let nav = "", body = "";

    const typeNames = new Set(D.types.map(t => t.typename));
    const enumsByType = {};
    const standaloneEnums = [];
    D.enums.forEach(e => {
        const dot = e.name.indexOf(".");
        const prefix = dot > 0 ? e.name.substring(0, dot) : "";
        if (prefix && typeNames.has(prefix)) {
            if (!enumsByType[prefix]) enumsByType[prefix] = [];
            enumsByType[prefix].push(e);
        } else {
            standaloneEnums.push(e);
        }
    });

    if (D.types.length) {
        const nsMap = {};
        D.types.forEach(t => {
            const dot = t.name.lastIndexOf(".");
            const ns = dot > 0 ? t.name.substring(0, dot) : "";
            if (!nsMap[ns]) nsMap[ns] = [];
            nsMap[ns].push(t);
        });
        const nsKeys = Object.keys(nsMap).filter(k => k !== "").sort();
        if (nsMap[""]) nsKeys.push("");
        const nsGroups = nsKeys.map(ns => ({ ns: ns || "Other", types: nsMap[ns || ""] }));

        nav += '<div class="nav-section"><div class="nav-section-title">Types</div>';
        body += '<h2 class="section-header" id="sec-types">Types</h2>';
        nsGroups.forEach(group => {
            nav += '<div class="nav-namespace" data-search="' + esc(group.ns.toLowerCase()) + '">' + esc(group.ns) + '</div>';
            body += '<h3 class="namespace-header" data-ns="' + esc(group.ns) + '">' + esc(group.ns) + '</h3>';
            group.types.forEach(t => {
                const id = slug("type", t.typename);
                nav += '<a class="nav-item" href="#' + id + '" data-search="' + esc(t.name.toLowerCase()) + '">' + esc(t.typename) + '</a>';
                t.methods.forEach(m => {
                    const sep = m.isStatic ? "." : ":";
                    const mId = slug("m", t.typename + sep + m.name);
                    nav += '<a class="nav-item nav-sub" href="#' + mId + '" data-search="' + esc((t.name + sep + m.name).toLowerCase()) + '">' + esc(sep + m.name) + '</a>';
                });

                let typeBody = "";
                if (t.description) typeBody += '<div class="description">' + renderDescription(t.description) + '</div>';
                t.methods.forEach(m => {
                    const sep = m.isStatic ? "." : ":";
                    const mId = slug("m", t.typename + sep + m.name);
                    typeBody += '<div class="method-block" id="' + mId + '" data-search="' + esc((sep + m.name).toLowerCase()) + '">';
                    typeBody += '<h4>' + esc(sep + m.name) + badgeHtml(m) + '</h4>';
                    typeBody += fnDetailHtml(m);
                    typeBody += '</div>';
                });
                const nestedEnums = enumsByType[t.typename] || [];
                nestedEnums.forEach(e => {
                    const eId = slug("enum", e.name);
                    const enumLabel = e.name.substring(t.typename.length + 1);
                    typeBody += '<div class="method-block" id="' + eId + '" data-search="' + esc(e.name.toLowerCase()) + '">';
                    typeBody += '<h4>.' + esc(enumLabel) + badgeHtml(e) + '</h4>';
                    if (e.description) typeBody += '<div class="description">' + renderDescription(e.description) + '</div>';
                    typeBody += '<div class="enum-cases">';
                    e.cases.forEach(c => { typeBody += '<span class="enum-case">.' + esc(c) + '</span>'; });
                    typeBody += '</div></div>';
                    nav += '<a class="nav-item nav-sub" href="#' + eId + '" data-search="' + esc(e.name.toLowerCase()) + '">.' + esc(enumLabel) + '</a>';
                });

                const searchTerms = [t.name.toLowerCase()]
                    .concat(t.methods.map(m => m.name.toLowerCase()))
                    .concat(nestedEnums.map(e => e.name.toLowerCase()))
                    .join(" ");
                body += '<div class="type-entry" id="' + id + '" data-search="' + esc(searchTerms) + '">';
                body += '<div class="type-header" onclick="this.parentElement.classList.toggle(\'open\')">';
                body += '<span class="chevron">&#9654;</span>';
                body += '<span class="type-name">' + esc(t.typename) + '</span>';
                body += badgeHtml(t);
                if (t.description) body += '<span class="type-desc">' + renderDescription(t.description) + '</span>';
                body += '</div>';
                body += '<div class="type-body">' + typeBody + '</div>';
                body += '</div>';
            });
        });
        nav += '</div>';
    }

    if (standaloneEnums.length) {
        nav += '<div class="nav-section"><div class="nav-section-title">Enums</div>';
        body += '<h2 class="section-header" id="sec-enums">Enums</h2>';
        standaloneEnums.forEach(e => {
            const id = slug("enum", e.name);
            const searchTerms = [e.name.toLowerCase()].concat(e.cases.map(c => c.toLowerCase())).join(" ");
            nav += '<a class="nav-item" href="#' + id + '" data-search="' + esc(searchTerms) + '">' + esc(e.name) + '</a>';
            body += '<div class="enum-entry" id="' + id + '" data-search="' + esc(searchTerms) + '">';
            body += '<h3>' + esc(e.name) + badgeHtml(e) + '</h3>';
            if (e.description) body += '<div class="description">' + renderDescription(e.description) + '</div>';
            body += '<div class="enum-cases">';
            e.cases.forEach(c => { body += '<span class="enum-case">.' + esc(c) + '</span>'; });
            body += '</div></div>';
        });
        nav += '</div>';
    }

    if (D.functions.length) {
        nav += '<div class="nav-section"><div class="nav-section-title">Functions</div>';
        body += '<h2 class="section-header" id="sec-functions">Functions</h2>';
        D.functions.forEach(f => {
            const id = slug("fn", f.name);
            nav += '<a class="nav-item" href="#' + id + '" data-search="' + esc(f.name.toLowerCase()) + '">' + esc(f.name) + '</a>';
            body += '<div class="fn-entry" id="' + id + '" data-search="' + esc(f.name.toLowerCase()) + '">';
            body += '<h3>' + esc(f.name) + badgeHtml(f) + '</h3>';
            body += fnDetailHtml(f);
            body += '</div>';
        });
        nav += '</div>';
    }

    navEl.innerHTML = nav;
    contentEl.innerHTML = body;
}

function filterAll() {
    const q = document.getElementById("search").value.toLowerCase().trim();
    const noResults = document.getElementById("no-results");
    let anyVisible = false;

    document.querySelectorAll("nav a.nav-item").forEach(item => {
        const match = !q || (item.dataset.search || "").includes(q);
        item.classList.toggle("hidden", !match);
    });
    document.querySelectorAll("nav .nav-namespace").forEach(ns => {
        let next = ns.nextElementSibling;
        let hasVisible = false;
        while (next && next.matches("a.nav-item")) {
            if (!next.classList.contains("hidden")) hasVisible = true;
            next = next.nextElementSibling;
        }
        ns.classList.toggle("hidden", !hasVisible);
    });
    document.querySelectorAll("nav .nav-section").forEach(sec => {
        const vis = sec.querySelector("a.nav-item:not(.hidden)");
        sec.classList.toggle("hidden", !vis);
    });

    document.querySelectorAll(".type-entry").forEach(el => {
        const match = !q || (el.dataset.search || "").includes(q);
        el.classList.toggle("hidden", !match);
        if (match) anyVisible = true;
        el.querySelectorAll(".method-block").forEach(m => {
            if (q) {
                m.classList.toggle("hidden", !(m.dataset.search || "").includes(q));
            } else {
                m.classList.remove("hidden");
            }
        });
    });
    document.querySelectorAll(".fn-entry, .enum-entry").forEach(el => {
        const match = !q || (el.dataset.search || "").includes(q);
        el.classList.toggle("hidden", !match);
        if (match) anyVisible = true;
    });
    document.querySelectorAll("h3.namespace-header").forEach(h => {
        let next = h.nextElementSibling;
        let hasVisible = false;
        while (next && next.matches(".type-entry")) {
            if (!next.classList.contains("hidden")) hasVisible = true;
            next = next.nextElementSibling;
        }
        h.classList.toggle("hidden", q && !hasVisible);
    });
    document.querySelectorAll("h2.section-header").forEach(h => {
        let next = h.nextElementSibling;
        let hasVisible = false;
        while (next && !next.matches("h2.section-header")) {
            if (!next.classList.contains("hidden") && !next.matches("h3.namespace-header")) hasVisible = true;
            next = next.nextElementSibling;
        }
        h.classList.toggle("hidden", q && !hasVisible);
    });

    noResults.classList.toggle("hidden", anyVisible || !q);
}

document.getElementById("search").addEventListener("input", filterAll);

document.getElementById("nav-list").addEventListener("click", function(e) {
    const link = e.target.closest("a.nav-item");
    if (!link) return;
    const href = link.getAttribute("href");
    if (!href || !href.startsWith("#")) return;
    const targetId = href.slice(1);
    expandTypeFor(targetId);
});

document.querySelector("main").addEventListener("click", function(e) {
    const link = e.target.closest("a.sig-link");
    if (!link) return;
    const href = link.getAttribute("href");
    if (!href || !href.startsWith("#")) return;
    const targetId = href.slice(1);
    expandTypeFor(targetId);
});
